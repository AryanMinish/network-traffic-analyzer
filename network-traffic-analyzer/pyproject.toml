[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "network-traffic-analyzer"
version = "1.0.0"
description = "Packet capture, protocol analysis and suspicious-traffic detection in pure Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aryan Minish Kanjiraparambil" }]
keywords = ["pcap", "packet capture", "network analysis", "tcp/ip", "intrusion detection"]

[project.urls]
Homepage = "https://github.com/AryanMinish/network-traffic-analyzer"

[project.optional-dependencies]
charts = ["matplotlib>=3.5"]
dashboard = ["flask>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
nta = "nta.cli:main"

[tool.setuptools]
packages = ["nta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
